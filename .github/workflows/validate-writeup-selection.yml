name: Validate write-up participant selection

on:
  push:
    branches:
      - fix/dispatch-task-badge
    paths:
      - .github/workflows/validate-writeup-selection.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/dispatch-task-badge

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore solution
        run: dotnet restore SmartGridSuite.sln -p:EnableWindowsTargeting=true

      - name: Build solution
        run: dotnet build SmartGridSuite.sln -c Release --no-restore -p:EnableWindowsTargeting=true

      - name: Remove one-time validation workflow
        if: success()
        run: rm .github/workflows/validate-writeup-selection.yml

      - name: Commit workflow cleanup
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove one-time write-up validation workflow"
          git push origin HEAD:fix/dispatch-task-badge
