# Requires a trusted certificate with IP SAN 10.130.206.135.
# Enable mod_ssl, mod_proxy, mod_proxy_http, and mod_headers.
<VirtualHost *:443>
    ServerName 10.130.206.135
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/smartgridsuite-fullchain.pem
    SSLCertificateKeyFile /etc/ssl/private/smartgridsuite.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader unset X-Forwarded-Proto
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        /api/ http://127.0.0.1:7140/api/ connectiontimeout=5 timeout=120
    ProxyPassReverse /api/ http://127.0.0.1:7140/api/
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Require all granted
        Options -Indexes
    </Directory>
    ErrorLog /var/log/apache2/smartgridsuite-https-error.log
    CustomLog /var/log/apache2/smartgridsuite-https-access.log combined
</VirtualHost>
